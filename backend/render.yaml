services:
  - type: web
    name: printflow-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "flask db upgrade && gunicorn wsgi:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_URL
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: ALLOWED_FILE_TYPES
        value: "pdf,doc,docx,jpg,jpeg,png,webp,txt"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
